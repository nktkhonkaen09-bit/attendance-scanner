<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#24115f"
>

<title>
ระบบเช็คชื่อนักเรียน นักศึกษา
</title>


<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>


<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  padding: 14px;

  min-height: 100vh;

  font-family:
    Tahoma,
    "Noto Sans Thai",
    sans-serif;

  color: white;

  background:
    linear-gradient(
      135deg,
      #071a52,
      #211875,
      #46208d,
      #6824a2
    );

}


.app {

  width: 100%;

  max-width: 520px;

  margin: auto;

}


.header {

  text-align: center;

  padding: 16px 8px;

}


.logo {

  font-size: 48px;

}


h1 {

  margin: 8px 0;

  font-size: 23px;

  line-height: 1.4;

}


.subtitle {

  opacity: .8;

  font-size: 14px;

}


/* ===============================
   SETUP CARD
   =============================== */

.setup {

  margin-top: 10px;

  padding: 18px;

  border-radius: 22px;

  background:
    rgba(255,255,255,.13);

  border:
    1px solid
    rgba(255,255,255,.2);

  backdrop-filter:
    blur(12px);

}


label {

  display: block;

  margin-bottom: 7px;

  font-size: 14px;

  font-weight: bold;

}


select {

  width: 100%;

  height: 48px;

  margin-bottom: 15px;

  padding: 0 13px;

  border: none;

  border-radius: 13px;

  background: white;

  color: #202040;

  font-size: 16px;

  outline: none;

}


.room {

  padding: 13px;

  margin-bottom: 4px;

  border-radius: 13px;

  background:
    rgba(255,255,255,.13);

}


.room-label {

  font-size: 12px;

  opacity: .7;

}


.room-value {

  margin-top: 3px;

  font-size: 19px;

  font-weight: bold;

}


/* ===============================
   BUTTON
   =============================== */

button {

  width: 100%;

  min-height: 48px;

  border: none;

  border-radius: 14px;

  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #a855f7
    );

  color: white;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

}


button:disabled {

  opacity: .5;

}


/* ===============================
   SCANNER
   =============================== */

.scanner {

  margin-top: 15px;

  padding: 14px;

  border-radius: 22px;

  background: white;

  color: #222;

}


.scanner-title {

  text-align: center;

  margin-bottom: 12px;

  color: #32156d;

  font-weight: bold;

  font-size: 18px;

}


#reader {

  width: 100%;

  overflow: hidden;

  border-radius: 16px;

}


#reader video {

  width: 100% !important;

  border-radius: 16px;

}


#reader button {

  width: auto;

  min-height: auto;

  padding: 9px 14px;

  margin: 4px;

  font-size: 14px;

}


/* ===============================
   STATUS
   =============================== */

.status {

  display: none;

  margin-top: 12px;

  padding: 13px;

  border-radius: 13px;

  text-align: center;

  font-weight: bold;

}


.status.show {

  display: block;

}


.loading {

  background: #e0e7ff;

  color: #3730a3;

}


.success {

  background: #dcfce7;

  color: #166534;

}


.error {

  background: #fee2e2;

  color: #991b1b;

}


.warning {

  background: #fef3c7;

  color: #92400e;

}


/* ===============================
   RESULT
   =============================== */

.result {

  display: none;

  margin-top: 12px;

  padding: 18px;

  border-radius: 17px;

  text-align: center;

  background: #ecfdf5;

  color: #14532d;

}


.result.show {

  display: block;

}


.result-icon {

  font-size: 45px;

}


.result-name {

  margin-top: 5px;

  font-size: 19px;

  font-weight: bold;

}


.result-id {

  margin-top: 5px;

}


.footer {

  padding: 20px;

  text-align: center;

  font-size: 12px;

  opacity: .65;

}


</style>

</head>


<body>


<div class="app">


<header class="header">

  <div class="logo">
    📚
  </div>

  <h1>
    ระบบเช็คชื่อนักเรียน นักศึกษา
  </h1>

  <div class="subtitle">
    วิทยาลัยเทคโนโลยีนครขอนแก่น
  </div>

</header>


<!-- =================================
     SETUP
     ================================= -->

<section class="setup">


<label>
  👨‍🏫 เลือกผู้สอน
</label>

<select id="teacherSelect">

  <option value="">
    -- กำลังโหลดข้อมูลผู้สอน --
  </option>

</select>


<label>
  📚 เลือกรายวิชา
</label>

<select
  id="courseSelect"
  disabled
>

  <option value="">
    -- กรุณาเลือกผู้สอนก่อน --
  </option>

</select>


<div class="room">

  <div class="room-label">
    🏫 ห้องเรียน
  </div>

  <div
    id="roomValue"
    class="room-value"
  >
    -
  </div>

</div>


</section>


<!-- =================================
     SCANNER
     ================================= -->

<section
  id="scannerSection"
  class="scanner"
  style="display:none;"
>

<div class="scanner-title">

  📷 สแกน QR Code นักศึกษา

</div>


<div id="reader"></div>


<div
  id="status"
  class="status"
></div>


<div
  id="result"
  class="result"
>

  <div
    id="resultIcon"
    class="result-icon"
  >
    ✅
  </div>

  <div
    id="resultTitle"
  >
    เช็คชื่อสำเร็จ
  </div>

  <div
    id="resultName"
    class="result-name"
  >
    -
  </div>

  <div
    id="resultId"
    class="result-id"
  >
    -
  </div>

</div>


</section>


<footer class="footer">

  📱 ระบบเช็คชื่อด้วย QR Code V1.1

</footer>


</div>



<script>


/* =================================================
   CONFIG
   ================================================= */


/*
 * นำ URL Apps Script เดิมของคุณ
 * มาใส่แทนข้อความด้านล่าง
 */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyZnE0RIZIyy-3PKoV69R67eLaUYxgkgfYy4GjkCK19IqubmKI4iHbIdrn9WMlbhfZxmQ/exec";


/* =================================================
   DOM
   ================================================= */

const teacherSelect =
  document.getElementById(
    "teacherSelect"
  );


const courseSelect =
  document.getElementById(
    "courseSelect"
  );


const roomValue =
  document.getElementById(
    "roomValue"
  );


const scannerSection =
  document.getElementById(
    "scannerSection"
  );


const statusEl =
  document.getElementById(
    "status"
  );


const resultEl =
  document.getElementById(
    "result"
  );


const resultIcon =
  document.getElementById(
    "resultIcon"
  );


const resultTitle =
  document.getElementById(
    "resultTitle"
  );


const resultName =
  document.getElementById(
    "resultName"
  );


const resultId =
  document.getElementById(
    "resultId"
  );


/* =================================================
   STATE
   ================================================= */

let selectedTeacher = null;

let selectedCourse = null;

let scanner = null;

let processing = false;

let lastCode = "";

let lastScanTime = 0;


/* =================================================
   INITIAL LOAD
   ================================================= */

window.addEventListener(
  "load",
  function() {

    loadTeachers();

  }
);


/* =================================================
   LOAD TEACHERS
   ================================================= */

function loadTeachers() {

  teacherSelect.innerHTML =

    '<option value="">⏳ กำลังโหลด...</option>';


  jsonp(
    "getTeachers",
    {},
    function(data) {

      if (
        !data ||
        data.success !== true
      ) {

        showStatus(
          "❌ ไม่สามารถโหลดข้อมูลผู้สอนได้",
          "error"
        );

        return;

      }


      teacherSelect.innerHTML =

        '<option value="">-- เลือกผู้สอน --</option>';


      data.teachers.forEach(
        function(teacher) {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            teacher.code;


          option.textContent =
            teacher.code +
            " - " +
            teacher.name;


          teacherSelect.appendChild(
            option
          );

        }
      );

    }
  );

}


/* =================================================
   TEACHER CHANGE
   ================================================= */

teacherSelect.addEventListener(
  "change",
  function() {

    const code =
      teacherSelect.value;


    selectedTeacher =
      null;


    selectedCourse =
      null;


    roomValue.textContent =
      "-";


    scannerSection.style.display =
      "none";


    stopScanner();


    courseSelect.disabled =
      true;


    courseSelect.innerHTML =

      '<option value="">⏳ กำลังโหลด...</option>';


    if (!code) {

      courseSelect.innerHTML =

        '<option value="">-- กรุณาเลือกผู้สอนก่อน --</option>';

      return;

    }


    /*
     * ค้นหาชื่อผู้สอนจาก option
     */

    const option =
      teacherSelect.options[
        teacherSelect.selectedIndex
      ];


    selectedTeacher = {

      code: code,

      name:
        option.textContent
          .replace(
            code + " - ",
            ""
          )

    };


    loadCourses(code);

  }
);


/* =================================================
   LOAD COURSES
   ================================================= */

function loadCourses(
  teacherCode
) {

  jsonp(

    "getCourses",

    {
      teacherCode:
        teacherCode
    },

    function(data) {

      if (
        !data ||
        data.success !== true
      ) {

        courseSelect.innerHTML =

          '<option value="">❌ โหลดรายวิชาไม่สำเร็จ</option>';

        return;

      }


      courseSelect.innerHTML =

        '<option value="">-- เลือกรายวิชา --</option>';


      data.courses.forEach(
        function(course) {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            JSON.stringify(
              course
            );


          option.textContent =
            course.code +
            " - " +
            course.name;


          courseSelect.appendChild(
            option
          );

        }
      );


      courseSelect.disabled =
        false;


      if (
        data.courses.length === 0
      ) {

        courseSelect.innerHTML =

          '<option value="">ไม่มีรายวิชาสำหรับผู้สอนนี้</option>';

      }

    }

  );

}


/* =================================================
   COURSE CHANGE
   ================================================= */

courseSelect.addEventListener(
  "change",
  function() {

    selectedCourse =
      null;


    roomValue.textContent =
      "-";


    scannerSection.style.display =
      "none";


    stopScanner();


    if (
      !courseSelect.value
    ) {

      return;

    }


    try {

      selectedCourse =
        JSON.parse(
          courseSelect.value
        );

    }
    catch (error) {

      showStatus(
        "❌ ข้อมูลรายวิชาไม่ถูกต้อง",
        "error"
      );

      return;

    }


    roomValue.textContent =
      selectedCourse.room ||
      "-";


    /*
     * เริ่ม Scanner
     */

    scannerSection.style.display =
      "block";


    startScanner();

  }
);


/* =================================================
   JSONP
   ================================================= */

function jsonp(
  action,
  params,
  callback
) {

  const callbackName =
    "cb_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() *
      100000
    );


  const script =
    document.createElement(
      "script"
    );


  const url =
    new URL(
      API_URL
    );


  url.searchParams.set(
    "action",
    action
  );


  url.searchParams.set(
    "callback",
    callbackName
  );


  Object.keys(params)
    .forEach(
      function(key) {

        url.searchParams.set(
          key,
          params[key]
        );

      }
    );


  let finished = false;


  window[callbackName] =
    function(data) {

      if (finished) {
        return;
      }


      finished = true;


      cleanup();


      callback(data);

    };


  script.src =
    url.toString();


  script.onerror =
    function() {

      if (finished) {
        return;
      }


      finished = true;


      cleanup();


      callback({

        success: false,

        message:
          "เชื่อมต่อ Apps Script ไม่สำเร็จ"

      });

    };


  document.body.appendChild(
    script
  );


  setTimeout(
    function() {

      if (finished) {
        return;
      }


      finished = true;


      cleanup();


      callback({

        success: false,

        message:
          "Apps Script ไม่ตอบกลับ"

      });

    },
    15000
  );


  function cleanup() {

    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );

    }


    try {

      delete window[
        callbackName
      ];

    }
    catch (e) {

      window[
        callbackName
      ] = undefined;

    }

  }

}


/* =================================================
   START SCANNER
   ================================================= */

function startScanner() {

  if (
    !selectedTeacher ||
    !selectedCourse
  ) {

    return;

  }


  stopScanner();


  scanner =
    new Html5Qrcode(
      "reader"
    );


  showStatus(
    "📷 กำลังเปิดกล้อง...",
    "loading"
  );


  scanner
    .start(

      {
        facingMode:
          "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      },

      onScanSuccess,

      function() {}

    )

    .then(
      function() {

        showStatus(
          "📷 พร้อมสแกน QR Code",
          "loading"
        );

      }
    )

    .catch(
      function(error) {

        console.error(
          error
        );


        showStatus(
          "❌ ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการใช้กล้อง",
          "error"
        );

      }
    );

}


/* =================================================
   STOP SCANNER
   ================================================= */

function stopScanner() {

  if (!scanner) {

    return;

  }


  scanner
    .stop()
    .catch(
      function() {}
    );


  scanner = null;

}


/* =================================================
   QR SUCCESS
   ================================================= */

function onScanSuccess(
  decodedText
) {

  if (
    processing
  ) {

    return;

  }


  const now =
    Date.now();


  if (

    decodedText === lastCode &&

    now - lastScanTime < 3000

  ) {

    return;

  }


  lastCode =
    decodedText;


  lastScanTime =
    now;


  processing =
    true;


  const studentId =
    String(
      decodedText
    ).trim();


  showStatus(
    "⏳ กำลังตรวจสอบและบันทึก...",
    "loading"
  );


  sendCheckin(
    studentId
  );

}


/* =================================================
   SEND CHECKIN
   ================================================= */

function sendCheckin(
  studentId
) {

  jsonp(

    "checkin",

    {

      studentId:
        studentId,

      teacherCode:
        selectedTeacher.code,

      courseCode:
        selectedCourse.code,

      room:
        selectedCourse.room

    },

    function(data) {

      handleResult(
        data
      );


      setTimeout(
        function() {

          processing =
            false;

        },
        1000
      );

    }

  );

}


/* =================================================
   HANDLE RESULT
   ================================================= */

function handleResult(
  data
) {

  if (
    !data
  ) {

    showStatus(
      "❌ ระบบไม่ตอบกลับ",
      "error"
    );

    return;

  }


  if (
    data.success === true
  ) {

    showStatus(
      "✅ บันทึกการเช็คชื่อสำเร็จ",
      "success"
    );


    resultIcon.textContent =
      "✅";


    resultTitle.textContent =
      "เช็คชื่อสำเร็จ";


    resultName.textContent =
      "👨‍🎓 " +
      (
        data.student?.name ||
        "-"
      );


    resultId.textContent =
      "รหัสนักศึกษา: " +
      (
        data.student?.studentId ||
        "-"
      );


    resultEl.className =
      "result show";


    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        [100,60,100]
      );

    }


    return;

  }


  if (
    data.duplicate === true
  ) {

    showStatus(
      "⚠️ นักศึกษาคนนี้เช็คชื่อแล้วในวันนี้",
      "warning"
    );


    resultIcon.textContent =
      "⚠️";


    resultTitle.textContent =
      "เช็คชื่อแล้ว";


    resultName.textContent =
      "👨‍🎓 " +
      (
        data.student?.name ||
        "-"
      );


    resultId.textContent =
      "รหัสนักศึกษา: " +
      (
        data.student?.studentId ||
        "-"
      );


    resultEl.className =
      "result show";


    return;

  }


  showStatus(

    "❌ " +
    (
      data.message ||
      "เช็คชื่อไม่สำเร็จ"
    ),

    "error"

  );


  resultIcon.textContent =
    "❌";


  resultTitle.textContent =
    "เช็คชื่อไม่สำเร็จ";


  resultName.textContent =
    data.student?.name
      ? "👨‍🎓 " +
        data.student.name
      : "";


  resultId.textContent =
    data.student?.studentId
      ? "รหัสนักศึกษา: " +
        data.student.studentId
      : "";


  resultEl.className =
    "result show";

}


/* =================================================
   STATUS
   ================================================= */

function showStatus(
  message,
  type
) {

  statusEl.textContent =
    message;


  statusEl.className =
    "status show " +
    type;

}


</script>

</body>

</html>
