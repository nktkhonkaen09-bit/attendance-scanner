<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#24115f"
  >

  <title>
    ระบบเช็คชื่อนักเรียน นักศึกษา
  </title>

  <!-- QR SCANNER LIBRARY -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>


  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;

      font-family:
        "Noto Sans Thai",
        "Tahoma",
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #071a52 0%,
          #1b1970 35%,
          #3b1b83 70%,
          #641fa0 100%
        );

      color: #ffffff;
    }


    body {
      min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
    }


    /* ==============================
       MAIN CONTAINER
       ============================== */

    .app {

      width: 100%;
      max-width: 520px;

      margin: 0 auto;

      min-height: calc(100vh - 32px);

      display: flex;
      flex-direction: column;
    }


    /* ==============================
       HEADER
       ============================== */

    .header {

      text-align: center;

      padding:
        18px
        12px
        12px;

    }


    .logo {

      width: 72px;
      height: 72px;

      margin:
        0 auto
        12px;

      border-radius: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 38px;

      background:
        rgba(255,255,255,0.16);

      border:
        1px solid
        rgba(255,255,255,0.25);

      box-shadow:
        0 10px 35px
        rgba(0,0,0,0.25);

      backdrop-filter:
        blur(10px);

    }


    .title {

      font-size: 24px;
      line-height: 1.35;

      font-weight: 800;

      margin: 0;

      text-shadow:
        0 3px 12px
        rgba(0,0,0,0.25);

    }


    .subtitle {

      margin-top: 7px;

      font-size: 14px;

      color:
        rgba(255,255,255,0.82);

    }


    /* ==============================
       INFO CARD
       ============================== */

    .info-card {

      margin-top: 10px;

      padding: 18px;

      border-radius: 22px;

      background:
        rgba(255,255,255,0.12);

      border:
        1px solid
        rgba(255,255,255,0.20);

      box-shadow:
        0 12px 35px
        rgba(0,0,0,0.18);

      backdrop-filter:
        blur(14px);

    }


    .info-row {

      display: flex;

      align-items: center;

      gap: 12px;

      padding: 9px 0;

    }


    .info-icon {

      width: 40px;
      height: 40px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background:
        rgba(255,255,255,0.15);

      font-size: 20px;

    }


    .info-label {

      font-size: 12px;

      color:
        rgba(255,255,255,0.70);

    }


    .info-value {

      margin-top: 2px;

      font-size: 16px;

      font-weight: 700;

      word-break: break-word;

    }


    /* ==============================
       SCANNER CARD
       ============================== */

    .scanner-card {

      margin-top: 16px;

      padding: 16px;

      border-radius: 24px;

      background:
        #ffffff;

      color: #1d2140;

      box-shadow:
        0 18px 50px
        rgba(0,0,0,0.25);

    }


    .scanner-title {

      text-align: center;

      font-size: 18px;

      font-weight: 800;

      color: #27136b;

      margin-bottom: 12px;

    }


    .scanner-title span {

      font-size: 24px;

      margin-right: 5px;

    }


    #reader {

      width: 100%;

      overflow: hidden;

      border-radius: 18px;

      background:
        #111827;

    }


    /*
     * ปรับ UI ของ html5-qrcode
     */

    #reader video {

      width: 100% !important;

      border-radius: 18px;

      object-fit: cover;

    }


    #reader__scan_region {

      min-height: 280px;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #111827;

    }


    #reader__dashboard {

      padding:
        12px 4px 4px;

    }


    #reader__dashboard_section {

      width: 100%;

    }


    #reader button {

      border: none;

      border-radius: 12px;

      padding:
        10px
        16px;

      margin: 4px;

      background:
        linear-gradient(
          135deg,
          #3520a0,
          #6420a5
        );

      color: white;

      font-weight: 700;

      cursor: pointer;

    }


    #reader select {

      max-width: 100%;

      padding: 9px;

      border-radius: 10px;

      border:
        1px solid
        #d4d4d8;

    }


    /* ==============================
       STATUS
       ============================== */

    .status {

      margin-top: 14px;

      padding: 15px;

      border-radius: 16px;

      text-align: center;

      font-size: 15px;

      font-weight: 700;

      display: none;

    }


    .status.show {
      display: block;
    }


    .status.loading {

      background:
        #eef2ff;

      color:
        #3730a3;

    }


    .status.success {

      background:
        #dcfce7;

      color:
        #166534;

    }


    .status.error {

      background:
        #fee2e2;

      color:
        #991b1b;

    }


    .status.warning {

      background:
        #fef3c7;

      color:
        #92400e;

    }


    /* ==============================
       RESULT CARD
       ============================== */

    .result {

      display: none;

      margin-top: 14px;

      padding: 18px;

      border-radius: 20px;

      text-align: center;

      background:
        linear-gradient(
          135deg,
          #ecfdf5,
          #dcfce7
        );

      color:
        #14532d;

      border:
        1px solid
        #bbf7d0;

    }


    .result.show {
      display: block;
    }


    .result-icon {

      font-size: 48px;

      line-height: 1;

      margin-bottom: 8px;

    }


    .result-title {

      font-size: 20px;

      font-weight: 900;

    }


    .student-name {

      margin-top: 8px;

      font-size: 18px;

      font-weight: 800;

    }


    .student-id {

      margin-top: 4px;

      font-size: 14px;

    }


    .result-time {

      margin-top: 8px;

      font-size: 13px;

      opacity: 0.8;

    }


    /* ==============================
       FOOTER
       ============================== */

    .footer {

      margin-top: auto;

      padding:
        18px 8px 8px;

      text-align: center;

      font-size: 12px;

      color:
        rgba(255,255,255,0.65);

    }


    /* ==============================
       MOBILE
       ============================== */

    @media (max-width: 420px) {

      body {
        padding: 10px;
      }

      .app {
        min-height:
          calc(100vh - 20px);
      }

      .title {
        font-size: 21px;
      }

      .info-card {
        padding: 14px;
      }

      .scanner-card {
        padding: 12px;
      }

      #reader__scan_region {
        min-height: 250px;
      }

    }


  </style>

</head>


<body>


<div class="app">


  <!-- =================================
       HEADER
       ================================= -->

  <header class="header">

    <div class="logo">
      📚
    </div>

    <h1 class="title">
      ระบบเช็คชื่อนักเรียน นักศึกษา
    </h1>

    <div class="subtitle">
      วิทยาลัยเทคโนโลยีนครขอนแก่น
    </div>

  </header>


  <!-- =================================
       CLASS INFORMATION
       ================================= -->

  <section class="info-card">


    <div class="info-row">

      <div class="info-icon">
        👨‍🏫
      </div>

      <div>

        <div class="info-label">
          ผู้สอน
        </div>

        <div
          class="info-value"
          id="teacherName"
        >
          กำลังโหลด...
        </div>

      </div>

    </div>


    <div class="info-row">

      <div class="info-icon">
        📖
      </div>

      <div>

        <div class="info-label">
          รายวิชา
        </div>

        <div
          class="info-value"
          id="courseName"
        >
          กำลังโหลด...
        </div>

      </div>

    </div>


    <div class="info-row">

      <div class="info-icon">
        🏫
      </div>

      <div>

        <div class="info-label">
          ห้องเรียน
        </div>

        <div
          class="info-value"
          id="roomName"
        >
          กำลังโหลด...
        </div>

      </div>

    </div>


  </section>


  <!-- =================================
       SCANNER
       ================================= -->

  <section class="scanner-card">


    <div class="scanner-title">

      <span>📷</span>

      สแกน QR Code นักศึกษา

    </div>


    <div id="reader"></div>


    <!-- STATUS -->

    <div
      id="status"
      class="status"
    ></div>


    <!-- RESULT -->

    <div
      id="result"
      class="result"
    >

      <div
        id="resultIcon"
        class="result-icon"
      >
        ✅
      </div>

      <div
        id="resultTitle"
        class="result-title"
      >
        เช็คชื่อสำเร็จ
      </div>

      <div
        id="studentName"
        class="student-name"
      >
        -
      </div>

      <div
        id="studentId"
        class="student-id"
      >
        -
      </div>

      <div
        id="resultTime"
        class="result-time"
      >
        -
      </div>

    </div>


  </section>


  <footer class="footer">

    📱 ระบบเช็คชื่อด้วย QR Code V1

    <br>

    วิทยาลัยเทคโนโลยีนครขอนแก่น

  </footer>


</div>



<script>

/* =====================================================
   CONFIGURATION
   ===================================================== */


/*
 * URL ของ Google Apps Script
 *
 * เป็น URL ที่คุณให้มา
 */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyZnE0RIZIyy-3PKoV69R67eLaUYxgkgfYy4GjkCK19IqubmKI4iHbIdrn9WMlbhfZxmQ/exec";


/*
 * อ่านค่าจาก URL
 *
 * ตัวอย่าง:
 *
 * ?teacherCode=T001
 * &teacherName=ครูทดสอบ
 * &courseCode=20204-2008
 * &courseName=การสร้างเว็บไซต์
 * &room=COM01
 */

const params =
  new URLSearchParams(
    window.location.search
  );


/*
 * ข้อมูลห้องเรียน / วิชา
 */

const CLASS_INFO = {

  teacherCode:
    params.get("teacherCode")
    || "T001",

  teacherName:
    params.get("teacherName")
    || "ครูทดสอบ",

  courseCode:
    params.get("courseCode")
    || "20204-2008",

  courseName:
    params.get("courseName")
    || "การสร้างเว็บไซต์",

  room:
    params.get("room")
    || "COM01"

};


/* =====================================================
   DOM
   ===================================================== */

const teacherNameEl =
  document.getElementById(
    "teacherName"
  );

const courseNameEl =
  document.getElementById(
    "courseName"
  );

const roomNameEl =
  document.getElementById(
    "roomName"
  );

const statusEl =
  document.getElementById(
    "status"
  );

const resultEl =
  document.getElementById(
    "result"
  );

const resultIconEl =
  document.getElementById(
    "resultIcon"
  );

const resultTitleEl =
  document.getElementById(
    "resultTitle"
  );

const studentNameEl =
  document.getElementById(
    "studentName"
  );

const studentIdEl =
  document.getElementById(
    "studentId"
  );

const resultTimeEl =
  document.getElementById(
    "resultTime"
  );


/* =====================================================
   SHOW CLASS INFORMATION
   ===================================================== */

teacherNameEl.textContent =
  CLASS_INFO.teacherName;

courseNameEl.textContent =
  CLASS_INFO.courseName;

roomNameEl.textContent =
  CLASS_INFO.room;


/* =====================================================
   SCANNER STATE
   ===================================================== */

let scanner = null;

let processing = false;

let lastScannedCode = "";

let lastScanTime = 0;


/*
 * ป้องกัน QR เดิมถูกอ่านหลายครั้ง
 */

const DUPLICATE_DELAY = 3000;


/* =====================================================
   STATUS FUNCTIONS
   ===================================================== */

function showStatus(
  message,
  type
) {

  statusEl.textContent =
    message;

  statusEl.className =
    "status show " +
    type;

}


function hideStatus() {

  statusEl.className =
    "status";

}


/* =====================================================
   RESULT FUNCTIONS
   ===================================================== */

function showResult(
  icon,
  title,
  name,
  studentId,
  time,
  type
) {

  resultIconEl.textContent =
    icon;

  resultTitleEl.textContent =
    title;

  studentNameEl.textContent =
    name
      ? "👨‍🎓 " + name
      : "";

  studentIdEl.textContent =
    studentId
      ? "รหัสนักศึกษา: " +
        studentId
      : "";

  resultTimeEl.textContent =
    time
      ? "🕐 " + time
      : "";

  resultEl.className =
    "result show";


  /*
   * เปลี่ยนสีตามผลลัพธ์
   */

  if (
    type === "error"
  ) {

    resultEl.style.background =
      "linear-gradient(135deg,#fff1f2,#ffe4e6)";

    resultEl.style.color =
      "#9f1239";

    resultEl.style.borderColor =
      "#fecdd3";

  }
  else {

    resultEl.style.background =
      "linear-gradient(135deg,#ecfdf5,#dcfce7)";

    resultEl.style.color =
      "#14532d";

    resultEl.style.borderColor =
      "#bbf7d0";

  }

}


/* =====================================================
   HIDE RESULT
   ===================================================== */

function hideResult() {

  resultEl.className =
    "result";

}


/* =====================================================
   QR SCAN SUCCESS
   ===================================================== */

async function onScanSuccess(
  decodedText
) {


  /*
   * ป้องกันการส่งซ้ำ
   */

  const now =
    Date.now();


  if (
    processing
  ) {

    return;

  }


  if (

    decodedText ===
      lastScannedCode &&

    now - lastScanTime <
      DUPLICATE_DELAY

  ) {

    return;

  }


  lastScannedCode =
    decodedText;

  lastScanTime =
    now;


  /*
   * หยุดประมวลผล QR ชั่วคราว
   */

  processing = true;


  hideResult();


  showStatus(
    "⏳ กำลังบันทึกการเช็คชื่อ...",
    "loading"
  );


  /*
   * ตัดช่องว่าง
   */

  const studentId =
    String(
      decodedText
    ).trim();


  /*
   * QR V1 ต้องมีเพียงรหัสนักศึกษา
   */

  if (
    !studentId
  ) {

    showStatus(
      "❌ QR Code ไม่มีข้อมูลรหัสนักศึกษา",
      "error"
    );

    processing =
      false;

    return;

  }


  /*
   * ส่งไป Apps Script
   */

  try {

    await sendCheckin(
      studentId
    );

  }
  catch (error) {

    console.error(
      error
    );

    showStatus(
      "❌ ไม่สามารถเชื่อมต่อระบบได้",
      "error"
    );

  }


  /*
   * เปิดให้สแกนคนต่อไป
   */

  setTimeout(
    function() {

      processing =
        false;

    },
    1000
  );

}


/* =====================================================
   SEND CHECK-IN
   ===================================================== */


/*
 * ใช้ JSONP
 *
 * เพราะ GitHub Pages และ Apps Script
 * อยู่คนละโดเมน
 */

function sendCheckin(
  studentId
) {

  return new Promise(
    function(
      resolve,
      reject
    ) {


      /*
       * ชื่อ callback
       */

      const callbackName =
        "attendanceCallback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      /*
       * สร้าง URL
       */

      const url =
        new URL(
          API_URL
        );


      url.searchParams.set(
        "action",
        "checkin"
      );


      url.searchParams.set(
        "studentId",
        studentId
      );


      url.searchParams.set(
        "teacherCode",
        CLASS_INFO.teacherCode
      );


      url.searchParams.set(
        "courseCode",
        CLASS_INFO.courseCode
      );


      url.searchParams.set(
        "room",
        CLASS_INFO.room
      );


      url.searchParams.set(
        "callback",
        callbackName
      );


      /*
       * สร้าง callback
       */

      window[
        callbackName
      ] =
        function(
          data
        ) {

          try {

            handleApiResponse(
              data
            );

            resolve(
              data
            );

          }
          catch (
            error
          ) {

            reject(
              error
            );

          }
          finally {

            cleanup();

          }

        };


      /*
       * สร้าง script
       */

      const script =
        document.createElement(
          "script"
        );


      script.src =
        url.toString();


      script.async =
        true;


      /*
       * กรณีโหลดไม่ได้
       */

      script.onerror =
        function() {

          cleanup();

          reject(
            new Error(
              "API connection failed"
            )
          );

        };


      document.body.appendChild(
        script
      );


      /*
       * timeout
       */

      const timeout =
        setTimeout(
          function() {

            cleanup();

            reject(
              new Error(
                "API timeout"
              )
            );

            showStatus(
              "❌ ระบบตอบกลับช้า กรุณาลองใหม่",
              "error"
            );

          },
          15000
        );


      /*
       * cleanup
       */

      function cleanup() {

        clearTimeout(
          timeout
        );


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }


        try {

          delete window[
            callbackName
          ];

        }
        catch (
          error
        ) {

          window[
            callbackName
          ] = undefined;

        }

      }

    }
  );

}


/* =====================================================
   HANDLE API RESPONSE
   ===================================================== */

function handleApiResponse(
  data
) {


  console.log(
    "API Response:",
    data
  );


  /*
   * ไม่มีข้อมูลตอบกลับ
   */

  if (
    !data
  ) {

    showStatus(
      "❌ ระบบไม่ส่งข้อมูลกลับมา",
      "error"
    );

    return;

  }


  /*
   * สำเร็จ
   */

  if (
    data.success === true
  ) {


    showStatus(
      "✅ บันทึกการเช็คชื่อสำเร็จ",
      "success"
    );


    showResult(

      "✅",

      "เช็คชื่อสำเร็จ",

      data.student &&
      data.student.name
        ? data.student.name
        : "-",

      data.student &&
      data.student.studentId
        ? data.student.studentId
        : "-",

      data.time
        ? data.time
        : "-",

      "success"

    );


    /*
     * เสียงแจ้งเตือน
     */

    playSuccessSound();


    /*
     * สั่นมือถือ
     */

    vibrate(
      [100, 60, 100]
    );


    return;

  }


  /*
   * เช็คชื่อซ้ำ
   */

  if (
    data.duplicate === true
  ) {


    showStatus(
      "⚠️ นักศึกษาคนนี้เช็คชื่อแล้ว",
      "warning"
    );


    showResult(

      "⚠️",

      "เช็คชื่อแล้ว",

      data.student &&
      data.student.name
        ? data.student.name
        : "-",

      data.student &&
      data.student.studentId
        ? data.student.studentId
        : "-",

      data.time
        ? data.time
        : "-",

      "error"

    );


    vibrate(
      [200]
    );


    return;

  }


  /*
   * Error จากระบบ
   */

  showStatus(

    "❌ " +
    (
      data.message ||
      "ไม่สามารถเช็คชื่อได้"
    ),

    "error"

  );


  showResult(

    "❌",

    "เช็คชื่อไม่สำเร็จ",

    data.student &&
    data.student.name
      ? data.student.name
      : "",

    data.student &&
    data.student.studentId
      ? data.student.studentId
      : "",

    "",

    "error"

  );


  vibrate(
    [200, 100, 200]
  );

}


/* =====================================================
   SUCCESS SOUND
   ===================================================== */

function playSuccessSound() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (
      !AudioContext
    ) {

      return;

    }


    const context =
      new AudioContext();


    const oscillator =
      context.createOscillator();


    const gain =
      context.createGain();


    oscillator.type =
      "sine";


    oscillator.frequency.value =
      880;


    gain.gain.value =
      0.12;


    oscillator.connect(
      gain
    );


    gain.connect(
      context.destination
    );


    oscillator.start();


    setTimeout(
      function() {

        oscillator.frequency.value =
          1175;

      },
      100
    );


    setTimeout(
      function() {

        oscillator.stop();

        context.close();

      },
      220
    );

  }
  catch (
    error
  ) {

    console.log(
      "Sound unavailable"
    );

  }

}


/* =====================================================
   VIBRATION
   ===================================================== */

function vibrate(
  pattern
) {

  try {

    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        pattern
      );

    }

  }
  catch (
    error
  ) {

    console.log(
      "Vibration unavailable"
    );

  }

}


/* =====================================================
   START SCANNER
   ===================================================== */

function startScanner() {


  showStatus(
    "📷 กำลังเตรียมกล้อง...",
    "loading"
  );


  scanner =
    new Html5Qrcode(
      "reader"
    );


  const config = {

    fps: 10,

    qrbox: function(
      viewfinderWidth,
      viewfinderHeight
    ) {

      const minEdge =
        Math.min(
          viewfinderWidth,
          viewfinderHeight
        );


      const size =
        Math.floor(
          minEdge * 0.70
        );


      return {

        width:
          Math.min(
            320,
            size
          ),

        height:
          Math.min(
            320,
            size
          )

      };

    },

    aspectRatio:
      1.0

  };


  /*
   * กล้องหลัง
   */

  scanner
    .start(

      {
        facingMode:
          "environment"
      },

      config,

      onScanSuccess,

      function(
        errorMessage
      ) {

        /*
         * ไม่ต้องแสดง error
         * ทุก frame เพราะจะเกิดถี่มาก
         */

      }

    )

    .then(
      function() {

        showStatus(
          "📷 พร้อมสแกน QR Code",
          "loading"
        );

      }
    )

    .catch(
      function(error) {

        console.error(
          error
        );


        showStatus(

          "❌ ไม่สามารถเปิดกล้องได้ " +
          "กรุณาอนุญาตการใช้กล้อง",

          "error"

        );

      }
    );

}


/* =====================================================
   PAGE LOAD
   ===================================================== */

window.addEventListener(
  "load",
  function() {

    startScanner();

  }
);


/* =====================================================
   PAGE CLOSE
   ===================================================== */

window.addEventListener(
  "beforeunload",
  function() {

    if (
      scanner
    ) {

      scanner
        .stop()
        .catch(
          function() {}
        );

    }

  }
);

</script>
